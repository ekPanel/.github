name: Translation
description: A wrong or missing translation, or a new language. অনুবাদের ভুল বা নতুন ভাষা।
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: বাংলা
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Where, what it says now, and what it should say
      description: A screenshot helps.
    validations:
      required: true
