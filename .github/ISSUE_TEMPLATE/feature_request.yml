name: Feature request
description: Suggest something ekPanel should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The problem or task, in your own words. Why is it hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could ekPanel help?
      description: Your idea, and how other panels (cPanel, aaPanel, Coolify…) do it, if you know.
